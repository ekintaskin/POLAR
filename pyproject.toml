[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polar-dmri"
description = "Diffusion MRI protocol design for reliable parameter recovery: a unified framework across biophysical models"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Ekin Taskin" }]
dynamic = ["version"]
keywords = ["diffusion MRI", "protocol optimization", "microstructure imaging"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "cma>=4.0",
    "joblib>=1.3",
    "numpy>=1.24",
    "pyyaml>=6",
    "scipy>=1.10",
]

[project.scripts]
polar-dmri = "polar_dmri.cli:main"

[tool.setuptools.dynamic]
version = { attr = "polar_dmri.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
